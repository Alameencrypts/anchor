name: Creatorverse Raid Notifier

on:
  schedule:
    # Every 5 minutes (GitHub's minimum). Times can be delayed under load.
    - cron: "*/5 * * * *"
  workflow_dispatch: {} # lets you run it manually from the Actions tab

# Avoid overlapping runs.
concurrency:
  group: creatorverse-notify
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Persist the "already seen" state between runs so you only get alerted once.
      - name: Restore state
        uses: actions/cache@v4
        with:
          path: creatorverse-notifier/seen.json
          key: cv-seen-${{ github.run_id }}
          restore-keys: |
            cv-seen-

      - name: Poll Creatorverse
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CREATORVERSE_API_URL: ${{ secrets.CREATORVERSE_API_URL }}
          CREATORVERSE_AUTH: ${{ secrets.CREATORVERSE_AUTH }}
          CREATORVERSE_COOKIE: ${{ secrets.CREATORVERSE_COOKIE }}
          RAIDS_PATH: ${{ secrets.RAIDS_PATH }}
        run: node creatorverse-notifier/poll.js
